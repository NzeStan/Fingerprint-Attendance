[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "django-fingerprint-attendance"
dynamic = ["version"]
description = "Reusable Django + DRF engine for fingerprint attendance: ZKTeco ADMS/Push, pull mode, enrollment, template sync and punch ingestion."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ifeanyi Nnamani" }]
maintainers = [{ name = "Ifeanyi Nnamani" }]
keywords = ["django", "attendance", "fingerprint", "biometric", "zkteco", "adms", "iclock", "time-clock"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "Django>=5.2,<6.2",
    "djangorestframework>=3.15",
    # Template encryption is on by default, so cryptography is a core dependency.
    "cryptography>=42",
]

[project.optional-dependencies]
celery = ["celery>=5.3"]
channels = ["channels>=4.0"]
pull = ["pyzk>=0.9"]
filters = ["django-filter>=24.0"]
openapi = ["drf-spectacular>=0.27"]
holidays = ["holidays>=0.50"]
crypto = []  # kept for backwards compatibility: cryptography is now a core dependency
all = [
    "celery>=5.3",
    "channels>=4.0",
    "pyzk>=0.9",
    "django-filter>=24.0",
    "drf-spectacular>=0.27",
    "holidays>=0.50",
]

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-cov>=5",
    "daphne>=4",
]
lint = ["ruff>=0.6", "mypy>=1.11", "django-stubs>=5.0", "djangorestframework-stubs>=3.15"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/NzeStan/Fingerprint-Attendance"
Documentation = "https://nzestan.github.io/Fingerprint-Attendance/"
Changelog = "https://github.com/NzeStan/Fingerprint-Attendance/blob/main/CHANGELOG.md"
Issues = "https://github.com/NzeStan/Fingerprint-Attendance/issues"

[tool.hatch.version]
path = "src/fingerprint_attendance/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fingerprint_attendance"]

[tool.hatch.build.targets.sdist]
include = ["src/fingerprint_attendance", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "noxfile.py", "mkdocs.yml"]
exclude = ["example_project"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
]
markers = ["slow: long running simulator scenarios"]

[tool.coverage.run]
source = ["fingerprint_attendance"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.$",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/fingerprint_attendance/migrations", "tests/testapp/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF", "S", "C4", "PIE", "PT", "RET"]
ignore = [
    "S101",    # assert is fine in tests
    "S311",    # random is not used for crypto
    "RUF012",  # Django/DRF class attributes are mutable by design
    "DJ001",   # null=True on CharField is intentional where used
    "RET504",
    "S105",
    "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT011", "PT018", "RUF001"]
"example_project/**" = ["S", "DJ"]
"noxfile.py" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["fingerprint_attendance"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "src"
packages = ["fingerprint_attendance"]
strict = true
warn_unused_ignores = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["fingerprint_attendance.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["zk.*", "holidays.*", "celery.*", "channels.*", "asgiref.*", "django_filters.*", "drf_spectacular.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"
